<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vardiya Durumu Hesaplayıcı</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="card">
        <div class="card-header">
            <h2>Vardiya Hesaplayıcı</h2>
        </div>

        <div class="input-group">
            <label for="groupSelect">Grup Seçiniz</label>
            <select id="groupSelect">
                <option value="1">1. Grup</option>
                <option value="2">2. Grup</option>
                <option value="3">3. Grup</option>
            </select>
        </div>

        <div class="input-group">
            <label for="targetDate">Sorgulanacak Tarih</label>
            <input type="date" id="targetDate" required>
        </div>

        <button onclick="hesapla()">Vardiyayı Bul</button>

        <div id="resultBox" class="result-box hidden">
            <span class="result-label">O günkü durumunuz:</span>
            <div id="resultText" class="result-text"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
